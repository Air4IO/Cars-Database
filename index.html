        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-root');
            if(!container) return;

            const isError = type === 'error';
            const icon = isError ? 'fa-circle-xmark' : 'fa-circle-check';
            const iconColor = isError ? 'text-red-400' : 'text-green-400';

            const toastEl = document.createElement('div');
            toastEl.className = "fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl z-50 flex items-center space-x-2 border border-slate-700 animate-fade-in";
            toastEl.innerHTML = `
                <i class="fa-solid ${icon} ${iconColor}"></i>
                <span class="text-sm font-medium">${message}</span>
            `;
            container.appendChild(toastEl);

            setTimeout(() => {
                toastEl.remove();
            }, 3000);
        }

        const API_BASE = 'http://127.0.0.1:8000';
        const ACCESS_TOKEN_KEY = 'aircare_access_token';
        const USER_KEY = 'aircare_user';

        function getAccessToken() {
            return localStorage.getItem(ACCESS_TOKEN_KEY) || '';
        }

        async function fetchCasesData() {
            const token = getAccessToken();

            if (!token) {
                state.cases = [];
                state.loading = false;
                renderApp();
                return;
            }

            state.loading = true;
            renderApp();

            try {
                const response = await fetch(API_BASE + '/cases', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (response.status === 401 || response.status === 403) {
                    throw new Error('SESSION_EXPIRED');
                }

                if (!response.ok) {
                    throw new Error(`Server responded with ${response.status}`);
                }

                const data = await response.json();
                state.cases = Array.isArray(data) ? data : [];

            } catch (err) {
                console.error('Backend API error:', err);

                if (err.message === 'SESSION_EXPIRED') {
                    localStorage.removeItem(ACCESS_TOKEN_KEY);
                    localStorage.removeItem(USER_KEY);
                    state.currentUser = null;
                    state.cases = [];
                    showToast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
                } else {
                    state.cases = [];
                    showToast('ไม่สามารถโหลดข้อมูลจากเซิร์ฟเวอร์ได้');
                }

            } finally {
                state.loading = false;
                renderApp();
            }
        }

        function getFilteredCases() {
            return state.cases.filter(item => {
                const brand = getCaseBrand(item);
                const model = getCaseModel(item);
                const year = getCaseYear(item);

                const matchesSearch = 
                    brand.toLowerCase().includes(state.searchKeyword.toLowerCase()) ||
                    model.toLowerCase().includes(state.searchKeyword.toLowerCase()) ||
                    year.toString().includes(state.searchKeyword);
                
                const matchesBrand = !state.selectedBrand || brand === state.selectedBrand;
                const matchesModel = !state.selectedModel || model === state.selectedModel;
                const matchesYear = !state.selectedYear || year.toString() === state.selectedYear.toString();

                return matchesSearch && matchesBrand && matchesModel && matchesYear;
            });
        }

        function renderPaginationHTML(totalFilteredItems, totalPages) {
            if (totalFilteredItems === 0) return '';

            const startIdx = ((state.currentPage - 1) * ITEMS_PER_PAGE) + 1;
            const endIdx = Math.min(state.currentPage * ITEMS_PER_PAGE, totalFilteredItems);

            // จำกัดจำนวนเลขหน้าที่แสดง เพื่อไม่ให้ Pagination ล้นกรอบ
            const pages = [];
            const addPage = (page) => {
                if (!pages.includes(page)) pages.push(page);
            };

            if (totalPages <= 7) {
                for (let page = 1; page <= totalPages; page++) addPage(page);
            } else {
                addPage(1);

                if (state.currentPage <= 4) {
                    addPage(2);
                    addPage(3);
                    addPage(4);
                    addPage(5);
                    pages.push('ellipsis-right');
                    addPage(totalPages);
                } else if (state.currentPage >= totalPages - 3) {
                    pages.push('ellipsis-left');
                    addPage(totalPages - 4);
                    addPage(totalPages - 3);
                    addPage(totalPages - 2);
                    addPage(totalPages - 1);
                    addPage(totalPages);
                } else {
                    pages.push('ellipsis-left');
                    addPage(state.currentPage - 1);
                    addPage(state.currentPage);
                    addPage(state.currentPage + 1);
                    pages.push('ellipsis-right');
                    addPage(totalPages);
                }
            }

            return `
                <div class="mt-10 flex flex-col sm:flex-row items-center justify-between bg-white px-6 py-4 rounded-2xl border border-slate-200 shadow-sm gap-4">
                    <div class="text-xs text-slate-500">
                        แสดงผล <span class="font-semibold text-slate-800">${startIdx}</span> ถึง <span class="font-semibold text-slate-800">${endIdx}</span> จากทั้งหมด <span class="font-semibold text-slate-800">${totalFilteredItems}</span> เคส
                    </div>

                    <div class="flex items-center justify-center gap-1.5 max-w-full">
                        <button 
                            onclick="handlePageChange(${state.currentPage - 1})"
                            ${state.currentPage === 1 ? 'disabled' : ''}
                            class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:hover:bg-transparent transition text-slate-700 flex items-center shrink-0"
                        >
                            <i class="fa-solid fa-chevron-left mr-1.5 text-[10px]"></i> ก่อนหน้า
                        </button>

                        <div class="flex items-center gap-1 shrink-0">
                            ${pages.map(page => {
                                if (typeof page === 'string') {
                                    return '<span class="w-5 text-center text-xs text-slate-400">...</span>';
                                }

                                return `
                                    <button 
                                        onclick="handlePageChange(${page})"
                                        class="w-8 h-8 text-xs font-semibold rounded-lg transition ${
                                            state.currentPage === page 
                                            ? 'bg-blue-600 text-white shadow-sm' 
                                            : 'text-slate-600 border border-slate-200 hover:bg-slate-50'
                                        }"
                                    >
                                        ${page}
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <button 
                            onclick="handlePageChange(${state.currentPage + 1})"
                            ${state.currentPage === totalPages ? 'disabled' : ''}
                            class="px-3 py-1.5 text-xs font-medium rounded-lg border border-slate-200 hover:bg-slate-50 disabled:opacity-30 disabled:hover:bg-transparent transition text-slate-700 flex items-center shrink-0"
                        >
                            ถัดไป <i class="fa-solid fa-chevron-right ml-1.5 text-[10px]"></i>
                        </button>
                    </div>
                </div>
            `;
        }

                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }

            if (state.activeModal === 'shopConfig') {
                return `
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                        <div class="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden border border-slate-100">
                            <div class="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                <h3 class="text-base font-bold flex items-center">
                                    <i class="fa-solid fa-sliders mr-2 text-blue-400"></i>
                                    ตั้งค่าข้อความร้านค้า
                                </h3>
                                <button onclick="closeModal()" class="text-slate-400 hover:text-white">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <form onsubmit="handleSaveShopConfig(event)" class="p-6 space-y-4 text-sm">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">ชื่อศูนย์บริการ</label>
                                    <input 
                                        type="text" 
                                        name="name"
                                        value="${state.shopConfig.name}"
                                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">สโลแกนย่อ</label>
                                    <input 
                                        type="text" 
                                        name="slogan"
                                        value="${state.shopConfig.slogan}"
                                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">พาดหัวแบนเนอร์หลัก (Hero Title)</label>
                                    <input 
                                        type="text" 
                                        name="heroTitle"
                                        value="${state.shopConfig.heroTitle}"
                                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    />
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-700 mb-1">คำอธิบายใต้พาดหัว</label>
                                    <textarea 
                                        name="heroSub"
                                        rows="2"
                                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    >${state.shopConfig.heroSub}</textarea>
                                </div>

                                <div class="pt-3 flex justify-end space-x-3 border-t">
                                    <button 
                                        type="button" 
                                        onclick="closeModal()"
                                        class="px-4 py-2 border text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-50"
                                    >
                                        ยกเลิก
                                    </button>
                                    <button 
                                        type="submit" 
                                        class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium shadow"
                                    >
                                        บันทึกข้อความ
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }

            if (state.activeModal === 'confirmDelete') {
                return `
                    <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in">
                        <div class="bg-white rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl border border-slate-100">
                            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl mb-3">
                                <i class="fa-solid fa-triangle-exclamation"></i>
                            </div>
                            <h3 class="text-base font-bold text-slate-800 mb-1">ยืนยันการลบเคส</h3>
                            <p class="text-xs text-slate-500 mb-6">คุณต้องการลบเคสนี้ออกจากคลังข้อมูลใช่หรือไม่?</p>
                            <div class="flex space-x-3">
                                <button 
                                    onclick="closeModal()" 
                                    class="flex-1 py-2 border text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-50"
                                >
                                    ยกเลิก
                                </button>
                                <button 
                                    onclick="executeDeleteCase()" 
                                    class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-medium shadow"
                                >
                                    ลบข้อมูล
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return '';
        }

        function renderApp() {
            const app = document.getElementById('app');

            if (!state.currentUser) {
                app.innerHTML = renderLoginView();
                document.getElementById('modal-root').innerHTML = '';
                return;
            }

            const filteredCases = getFilteredCases();
            const totalPages = Math.max(1, Math.ceil(filteredCases.length / ITEMS_PER_PAGE));
            const startIdx = (state.currentPage - 1) * ITEMS_PER_PAGE;
            const currentCases = filteredCases.slice(startIdx, startIdx + ITEMS_PER_PAGE);

            app.innerHTML = `
                <div>
                    ${renderHeaderHTML()}
                    ${renderHeroHTML()}
                    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        ${renderFiltersHTML(filteredCases)}
                        ${renderGalleryHTML(currentCases)}
                        ${renderPaginationHTML(filteredCases.length, totalPages)}
                    </main>
                </div>
                <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 mt-12 text-center text-xs">
                    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="flex items-center space-x-3">
                            ${renderLogo("h-7", "white")}
                            <span class="text-slate-500">|</span>
                            <span>${state.shopConfig.slogan}</span>
                        </div>
                        <div>${state.shopConfig.footerText}</div>
                    </div>
                </footer>
            `;

            document.getElementById('modal-root').innerHTML = renderModalsHTML();
        }

        async function handleLogin(userObj) {
            state.currentUser = userObj;
            renderApp();
            await fetchCasesData();
            showToast('เข้าสู่ระบบเรียบร้อย');
        }

        async function handleCustomLogin(e) {
            e.preventDefault();

            const usernameInput = document.getElementById('login-username-input');
            const passwordInput = document.getElementById('login-password-input');

            const username = usernameInput ? usernameInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value : '';

            if (!username || !password) {
                showToast('กรุณากรอก Username และ Password');
                return;
            }

            const submitButton = e.target.querySelector('button[type="submit"]');
            const originalText = submitButton ? submitButton.innerHTML : '';

            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'กำลังเข้าสู่ระบบ...';
            }

            try {
                const response = await fetch(API_BASE + '/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                let data = {};
                try {
                    data = await response.json();
                } catch (_) {}

                if (!response.ok) {
                    throw new Error(data.detail || 'Username หรือ Password ไม่ถูกต้อง');
                }

                const token = data.access_token || data.token;
                if (!token) {
                    throw new Error('ไม่พบ Access Token จากเซิร์ฟเวอร์');
                }

                const apiUser = data.user || {
                    username: data.username || username,
                    name: data.name || data.username || username,
                    role: data.role || 'user',
                    allowed_brands: data.allowed_brands || ''
                };

                const normalizedUser = {
                    ...apiUser,
                    name: apiUser.name || apiUser.username || username
                };

                localStorage.setItem(ACCESS_TOKEN_KEY, token);
                localStorage.setItem(USER_KEY, JSON.stringify(normalizedUser));

                state.currentUser = normalizedUser;
                state.currentPage = 1;
                await fetchCasesData();

                showToast('เข้าสู่ระบบเรียบร้อย');

            } catch (err) {
                console.error('Login error:', err);
                showToast(err.message || 'ไม่สามารถเข้าสู่ระบบได้', 'error');

            } finally {
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.innerHTML = originalText;
                }
            }
        }

        function handleLogout() {
            localStorage.removeItem(ACCESS_TOKEN_KEY);
            localStorage.removeItem(USER_KEY);

            state.currentUser = null;
            state.cases = [];
            state.loading = false;
            state.currentPage = 1;
            state.selectedBrand = '';
            state.selectedModel = '';
            state.selectedYear = '';
            state.searchKeyword = '';

            renderApp();
            showToast('ออกจากระบบเรียบร้อย');
        }

        function handleSearchInput(val) {
            state.searchKeyword = val;
            state.currentPage = 1;

            // renderApp() rebuilds the search input, which normally causes the
            // browser to lose focus after every keystroke. Restore focus and
            // caret position immediately after rendering so typing can continue.
            const cursorPosition = val.length;
            renderApp();

            requestAnimationFrame(() => {
                const input = document.querySelector('input[oninput="handleSearchInput(this.value)"]');
                if (input) {
                    input.focus();
                    try {
                        input.setSelectionRange(cursorPosition, cursorPosition);
                    } catch (_) {}
                }
            });
        }

        function handleBrandChange(val) {
            state.selectedBrand = val;
            state.selectedModel = '';
            state.currentPage = 1;
            renderApp();
        }

        function handleModelChange(val) {
            state.selectedModel = val;
            state.currentPage = 1;
            renderApp();
        }

        function handleYearChange(val) {
            state.selectedYear = val;
            state.currentPage = 1;
            renderApp();
        }

        function handleResetFilters() {
            state.searchKeyword = '';
            state.selectedBrand = '';
            state.selectedModel = '';
            state.selectedYear = '';
            state.currentPage = 1;
            renderApp();
        }

        function handlePageChange(newPage) {
            const filteredCases = getFilteredCases();
            const totalPages = Math.max(1, Math.ceil(filteredCases.length / ITEMS_PER_PAGE));
            state.currentPage = Math.max(1, Math.min(newPage, totalPages));
            renderApp();
            window.scrollTo({ top: 350, behavior: 'smooth' });
        }

        function openModal(type, targetId = null) {
            state.activeModal = type;
            if (type === 'detail' || type === 'addEdit') {
                if (typeof targetId === 'string') {
                    state.activeCaseItem = state.cases.find(c => getCaseId(c) === targetId) || null;
                } else if (typeof targetId === 'object') {
                    state.activeCaseItem = targetId;
                } else {
                    state.activeCaseItem = null;
                }
            }
            renderApp();
        }

        function closeModal() {
            state.activeModal = null;
            state.activeCaseItem = null;
            state.deleteTargetId = null;
            renderApp();
        }

        function promptDeleteCase(id) {
            state.deleteTargetId = id;
            state.activeModal = 'confirmDelete';
            renderApp();
        }

        function executeDeleteCase() {
            if (state.deleteTargetId) {
                state.cases = state.cases.filter(c => getCaseId(c) !== state.deleteTargetId);
                showToast('ลบข้อมูลเคสเรียบร้อยแล้ว');
            }
            closeModal();
        }

        function handleSaveCaseForm(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            const caseId = formData.get('caseId') || `case-${Date.now()}`;
            const brand = formData.get('brand');
            const model = formData.get('model');
            const year = formData.get('year');
            const mileage = formData.get('mileage');
            const pressureLow = formData.get('pressureLow');
            const pressureHigh = formData.get('pressureHigh');
            const imageUrlsText = formData.get('imageUrls') || '';

            const urls = imageUrlsText.split('\n').map(u => u.trim()).filter(Boolean);
            const existingImages = getCaseImages(state.activeCaseItem);

            const updatedImages = urls.map((url, idx) => {
                const matched = existingImages[idx];
                return {
                    id: matched?.id || `img-${Date.now()}-${idx}`,
                    name: matched?.name || `IMG${String(idx + 1).padStart(3, '0')}.jpg`,
                    url: url,
                    type: matched?.type || 'unknown'
                };
            });

            const savedCase = {
                id: caseId,
                brand,
                model,
                year,
                mileage,
                pressureLow,
                pressureHigh,
                date: state.activeCaseItem?.date || new Date().toISOString().split('T')[0],
                images: updatedImages
            };

            const existsIdx = state.cases.findIndex(c => getCaseId(c) === caseId);
            if (existsIdx >= 0) {
                state.cases[existsIdx] = savedCase;
            } else {
                state.cases.unshift(savedCase);
            }

            closeModal();
            showToast(existsIdx >= 0 ? 'บันทึกข้อมูลเคสเรียบร้อย' : 'เพิ่มเคสใหม่เรียบร้อย');
        }

        function handleSaveShopConfig(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            const newConfig = {
                name: formData.get('name'),
                slogan: formData.get('slogan'),
                heroTitle: formData.get('heroTitle'),
                heroSub: formData.get('heroSub'),
                footerText: state.shopConfig.footerText
            };

            state.shopConfig = newConfig;
            localStorage.setItem('air4_shop_config', JSON.stringify(newConfig));
            closeModal();
            showToast('ปรับเปลี่ยนข้อความร้านค้าเรียบร้อยแล้ว');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const token = getAccessToken();

            if (!token) {
                state.loading = false;
                renderApp();
                return;
            }

            try {
                const response = await fetch(API_BASE + '/me', {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!response.ok) {
                    throw new Error('SESSION_EXPIRED');
                }

                const user = await response.json();

                state.currentUser = {
                    ...user,
                    name: user.name || user.username || 'User'
                };

                localStorage.setItem(USER_KEY, JSON.stringify(state.currentUser));
                await fetchCasesData();

            } catch (err) {
                localStorage.removeItem(ACCESS_TOKEN_KEY);
                localStorage.removeItem(USER_KEY);

                state.currentUser = null;
                state.cases = [];
                state.loading = false;
                renderApp();
            }
        });
    </script>
</body>
</html>
