<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIR-4 - คลังผลงานการล้างคอยล์เย็นรถยนต์</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0033aa',
                            darkblue: '#002277',
                            lightbg: '#f4f7fc'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Fonts: Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React and Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #f8fafc;
        }
        .bg-grid-pattern {
            background-image: radial-gradient(rgba(0, 51, 170, 0.1) 1px, transparent 0);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const DEFAULT_SHOP_CONFIG = {
            name: "AIR-4",
            slogan: "ศูนย์บริการล้างคอยล์เย็นและดูแลระบบแอร์รถยนต์มาตรฐานสูง",
            heroTitle: "คลังผลงานการล้างคอยล์เย็นรถยนต์",
            heroSub: "ภาพเปรียบเทียบความสะอาด สภาพคอยล์เย็น ค่าแรงดันน้ำยา และคราบน้ำเสียจริงก่อน-หลังการบริการ",
            footerText: "© 2026 AIR-4 Auto Air Conditioning Service Center. สงวนลิขสิทธิ์"
        };

        const INITIAL_CASES = [
            {
                id: "case-101",
                brand: "Toyota",
                model: "Camry",
                year: "2020",
                mileage: "85,000",
                pressureLow: "32",
                pressureHigh: "185",
                date: "2026-03-10",
                images: [
                    { id: "img-101-1", name: "IMG001.jpg", url: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=800&q=80", type: "unknown" },
                    { id: "img-101-2", name: "IMG002.jpg", url: "https://images.unsplash.com/photo-1580273916550-e323be2ae537?auto=format&fit=crop&w=800&q=80", type: "unknown" },
                    { id: "img-101-3", name: "IMG003.jpg", url: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80", type: "unknown" },
                    { id: "img-101-4", name: "IMG004.jpg", url: "https://images.unsplash.com/photo-1541888946425-d0fbb186a5b3?auto=format&fit=crop&w=800&q=80", type: "unknown" }
                ]
            },
            {
                id: "case-102",
                brand: "Honda",
                model: "Civic FE",
                year: "2022",
                mileage: "45,000",
                pressureLow: "30",
                pressureHigh: "175",
                date: "2026-03-12",
                images: [
                    { id: "img-102-1", name: "IMG001.jpg", url: "https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&w=800&q=80", type: "unknown" },
                    { id: "img-102-2", name: "IMG002.jpg", url: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=800&q=80", type: "unknown" },
                    { id: "img-102-3", name: "IMG003.jpg", url: "https://images.unsplash.com/photo-1581092335397-9583fe92d232?auto=format&fit=crop&w=800&q=80", type: "unknown" }
                ]
            },
            {
                id: "case-103",
                brand: "Isuzu",
                model: "D-Max",
                year: "2019",
                mileage: "120,000",
                pressureLow: "35",
                pressureHigh: "210",
                date: "2026-03-14",
                images: [
                    { id: "img-103-1", name: "IMG001.jpg", url: "https://images.unsplash.com/photo-1517524008697-84bbe3c3fd98?auto=format&fit=crop&w=800&q=80", type: "unknown" },
                    { id: "img-103-2", name: "IMG002.jpg", url: "https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=800&q=80", type: "unknown" }
                ]
            }
        ];

        // Helper functions for image array normalization
        const getCaseImages = (item) => item?.images || item?.Images || [];
        const getCaseBrand = (item) => item?.brand || item?.Brand || '';
        const getCaseModel = (item) => item?.model || item?.Model || '';
        const getCaseYear = (item) => item?.year || item?.Year || '';
        const getCaseId = (item) => item?.id || item?.CaseID || '';

        const Air4Logo = ({ className = "h-9", variant = "white", alt = "AIR-4 Logo" }) => {
            const logoSrc = variant === "blue" ? "Logo Blue.png" : "Logo White.png";
            const fallbackBg = variant === "blue" ? "bg-blue-600 text-white" : "bg-black text-white";
            
            return (
                <div class="inline-flex items-center">
                    <img 
                        src={logoSrc} 
                        alt={alt} 
                        className={`object-contain block ${className}`}
                        onError={(e) => {
                            // If local image fails to load, show clean SVG badge
                            e.target.style.display = 'none';
                            if(e.target.nextSibling) {
                                e.target.nextSibling.style.display = 'inline-flex';
                            }
                        }}
                    />
                    <span 
                        style={{ display: 'none' }} 
                        className={`font-black italic tracking-wider px-3 py-1 rounded text-xl ${fallbackBg}`}
                    >
                        AIR-4
                    </span>
                </div>
            );
        };

        function App() {
            // Local state management
            const [user, setUser] = React.useState(null); // { role: 'admin' | 'customer', name: string }
            const [cases, setCases] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [error, setError] = React.useState(null);
            const [shopConfig, setShopConfig] = React.useState(() => {
                const saved = localStorage.getItem('air4_shop_config');
                return saved ? JSON.parse(saved) : DEFAULT_SHOP_CONFIG;
            });

            // Filter states
            const [searchKeyword, setSearchKeyword] = React.useState('');
            const [selectedBrand, setSelectedBrand] = React.useState('');
            const [selectedModel, setSelectedModel] = React.useState('');
            const [selectedYear, setSelectedYear] = React.useState('');

            // Modal states
            const [showLoginModal, setShowLoginModal] = React.useState(false);
            const [showCaseModal, setShowCaseModal] = React.useState(null); // Case object or null
            const [showAddEditModal, setShowAddEditModal] = React.useState(false); // false or case object
            const [showShopConfigModal, setShowShopConfigModal] = React.useState(false);
            const [toastMessage, setToastMessage] = React.useState('');

            // Fetch cases from FastAPI backend on mount
            React.useEffect(() => {
                const fetchCases = async () => {
                    setLoading(true);
                    setError(null);
                    try {
                        const response = await fetch('http://127.0.0.1:8000/cases', {
                            method: 'GET',
                            mode: 'cors', // Explicitly requesting CORS
                            headers: { 'Accept': 'application/json' }
                        });
                        
                        if (!response.ok) {
                            throw new Error(`Server responded with ${response.status}`);
                        }
                        
                        const data = await response.json();
                        setCases(Array.isArray(data) ? data : INITIAL_CASES);
                    } catch (err) {
                        console.warn("Backend unavailable, using default data:", err);
                        setError("Could not connect to backend. Using local sample data.");
                        setCases(INITIAL_CASES);
                    } finally {
                        setLoading(false);
                    }
                };

                fetchCases();
            }, []);

            // Save shop config to localStorage when updated
            React.useEffect(() => {
                localStorage.setItem('air4_shop_config', JSON.stringify(shopConfig));
            }, [shopConfig]);

            // Toast helper
            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(''), 3000);
            };

            // Unique lists for dropdown filters
            const brands = React.useMemo(() => [...new Set(cases.map(c => getCaseBrand(c)))].filter(Boolean).sort(), [cases]);
            const models = React.useMemo(() => {
                const filtered = selectedBrand ? cases.filter(c => getCaseBrand(c) === selectedBrand) : cases;
                return [...new Set(filtered.map(c => getCaseModel(c)))].filter(Boolean).sort();
            }, [cases, selectedBrand]);
            const years = React.useMemo(() => [...new Set(cases.map(c => getCaseYear(c)))].filter(Boolean).sort((a,b) => b-a), [cases]);

            // Filtered cases list
            const filteredCases = React.useMemo(() => {
                return cases.filter(item => {
                    const brand = getCaseBrand(item);
                    const model = getCaseModel(item);
                    const year = getCaseYear(item);

                    const matchesSearch = 
                        brand.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                        model.toLowerCase().includes(searchKeyword.toLowerCase()) ||
                        year.toString().includes(searchKeyword);
                    
                    const matchesBrand = !selectedBrand || brand === selectedBrand;
                    const matchesModel = !selectedModel || model === selectedModel;
                    const matchesYear = !selectedYear || year.toString() === selectedYear.toString();

                    return matchesSearch && matchesBrand && matchesModel && matchesYear;
                });
            }, [cases, searchKeyword, selectedBrand, selectedModel, selectedYear]);

            // Reset filters
            const handleResetFilters = () => {
                setSearchKeyword('');
                setSelectedBrand('');
                setSelectedModel('');
                setSelectedYear('');
            };

            // Delete case handler
            const handleDeleteCase = (id) => {
                if(window.confirm('คุณต้องการลบเคสนี้ใช่หรือไม่?')) {
                    setCases(prev => prev.filter(c => c.id !== id));
                    showToast('ลบข้อมูลเคสเรียบร้อยแล้ว');
                }
            };

            // If user is not logged in, show full screen Login Page directly
            if (!user) {
                return (
                    <LoginPage 
                        onLogin={(userData) => {
                            setUser(userData);
                            showToast(`เข้าสู่ระบบในฐานะ ${userData.role === 'admin' ? 'Admin' : 'ผู้เยี่ยมชม'} เรียบร้อย`);
                        }} 
                    />
                );
            }

            return (
                <div class="min-h-screen flex flex-col justify-between">
                    <div>
                        {/* NAVBAR */}
                        <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-30">
                            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
                                <div class="flex items-center space-x-3 cursor-pointer" onClick={handleResetFilters}>
                                    <Air4Logo className="h-10 sm:h-12" variant="white" />
                                    <div class="border-l border-slate-700 pl-3 hidden sm:block">
                                        <div class="text-lg font-bold leading-none text-blue-400">{shopConfig.name}</div>
                                        <div class="text-xs text-slate-400 mt-1">{shopConfig.slogan}</div>
                                    </div>
                                </div>

                                <div class="flex items-center space-x-2 sm:space-x-4">
                                    {user?.role === 'admin' && (
                                        <>
                                            <button 
                                                onClick={() => setShowAddEditModal({})}
                                                class="bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-medium px-3 py-2 rounded-lg flex items-center shadow-md transition"
                                            >
                                                <i class="fa-solid font-bold fa-plus mr-1.5"></i>
                                                เพิ่มเคสใหม่
                                            </button>
                                            <button 
                                                onClick={() => setShowShopConfigModal(true)}
                                                class="bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs sm:text-sm font-medium px-3 py-2 rounded-lg flex items-center border border-slate-700 transition"
                                                title="แก้ไขข้อความร้านค้า"
                                            >
                                                <i class="fa-solid fa-gear mr-1.5"></i>
                                                <span class="hidden md:inline">ตั้งค่าร้าน</span>
                                            </button>
                                        </>
                                    )}

                                    <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                        <span class={`inline-block w-2.5 h-2.5 rounded-full ${user.role === 'admin' ? 'bg-amber-400' : 'bg-green-400'}`}></span>
                                        <span class="text-xs sm:text-sm font-medium">{user.role === 'admin' ? 'ผู้ดูแลระบบ (Admin)' : 'ลูกค้า / ผู้เยี่ยมชม'}</span>
                                        <button 
                                            onClick={() => { setUser(null); showToast('ออกจากระบบเรียบร้อย'); }} 
                                            class="text-slate-400 hover:text-red-400 text-xs ml-2 pl-2 border-l border-slate-700 flex items-center"
                                            title="ออกจากระบบ"
                                        >
                                            <i class="fa-solid fa-right-from-bracket mr-1"></i>
                                            <span class="hidden sm:inline">ออกจากระบบ</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* HERO BANNER SECTION */}
                        <div class="bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 text-white py-10 px-4 sm:px-6 relative overflow-hidden bg-grid-pattern">
                            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between relative z-10">
                                <div class="mb-6 md:mb-0 max-w-2xl text-center md:text-left">
                                    <div class="inline-flex items-center space-x-2 bg-blue-900/60 text-blue-300 text-xs font-semibold px-3 py-1 rounded-full border border-blue-700/50 mb-3">
                                        <i class="fa-solid fa-circle-check text-blue-400"></i>
                                        <span>มาตรฐานตรวจเช็คระบบแอร์ AIR-4</span>
                                    </div>
                                    <h1 class="text-2xl sm:text-4xl font-bold tracking-tight mb-2 text-white">{shopConfig.heroTitle}</h1>
                                    <p class="text-slate-300 text-sm sm:text-base">{shopConfig.heroSub}</p>
                                </div>
                                <div class="flex items-center space-x-4 bg-slate-800/80 p-4 rounded-xl border border-slate-700 backdrop-blur">
                                    <div class="text-center px-4 border-r border-slate-700">
                                        <div class="text-2xl sm:text-3xl font-extrabold text-blue-400">{cases.length}</div>
                                        <div class="text-xs text-slate-400">เคสตัวอย่างในคลัง</div>
                                    </div>
                                    <div class="text-center px-4">
                                        <div class="text-2xl sm:text-3xl font-extrabold text-green-400">100%</div>
                                        <div class="text-xs text-slate-400">สะอาด ปลอดเชื้อ</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* FILTER & SEARCH BAR */}
                        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                            {/* FILTER PANEL */}
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-8">
                                <div class="flex flex-col md:flex-row items-center justify-between mb-4 pb-4 border-b border-slate-100 gap-2">
                                    <div class="flex items-center space-x-2 w-full md:w-auto">
                                        <i class="fa-solid fa-filter text-blue-600"></i>
                                        <h2 class="text-base font-semibold text-slate-800">ค้นหาและกรองรุ่นรถ</h2>
                                        <span class="text-xs text-slate-500 font-normal">({filteredCases.length} รายการ)</span>
                                    </div>
                                    {(searchKeyword || selectedBrand || selectedModel || selectedYear) && (
                                        <button 
                                            onClick={handleResetFilters}
                                            class="text-xs text-red-600 hover:text-red-800 font-medium flex items-center self-end md:self-auto"
                                        >
                                            <i class="fa-solid fa-rotate-left mr-1"></i> ล้างตัวกรองทั้งหมด
                                        </button>
                                    )}
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {/* Keyword Search */}
                                    <div>
                                        <label class="block text-xs font-medium text-slate-600 mb-1">ค้นหาคำขวัญ / ยี่ห้อ / รุ่น</label>                                        <div class="relative">
                                            <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                                            <input 
                                                type="text"
                                                value={searchKeyword}
                                                onChange={(e) => setSearchKeyword(e.target.value)}
                                                placeholder="เช่น Toyota, Civic, 2022..."
                                                class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                                            />
                                        </div>
                                    </div>

                                    {/* Brand Select */}
                                    <div>
                                        <label class="block text-xs font-medium text-slate-600 mb-1">ยี่ห้อรถ (Brand)</label>
                                        <select 
                                            value={selectedBrand}
                                            onChange={(e) => { setSelectedBrand(e.target.value); setSelectedModel(''); }}
                                            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                                        >
                                            <option value="">-- ทั้งหมดทุกยี่ห้อ --</option>
                                            {brands.map(b => (
                                                <option key={b} value={b}>{b}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* Model Select */}
                                    <div>
                                        <label class="block text-xs font-medium text-slate-600 mb-1">รุ่นรถ (Model)</label>
                                        <select 
                                            value={selectedModel}
                                            onChange={(e) => setSelectedModel(e.target.value)}
                                            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                                        >
                                            <option value="">-- ทั้งหมดทุกรุ่น --</option>
                                            {models.map(m => (
                                                <option key={m} value={m}>{m}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {/* Year Select */}
                                    <div>
                                        <label class="block text-xs font-medium text-slate-600 mb-1">ปีรถ (Year)</label>
                                        <select 
                                            value={selectedYear}
                                            onChange={(e) => setSelectedYear(e.target.value)}
                                            class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white"
                                        >
                                            <option value="">-- ทั้งหมดทุกปี --</option>
                                            {years.map(y => (
                                                <option key={y} value={y}>{y}</option>
                                            ))}
                                        </select>
                                    </div>
                                </div>
                            </div>

                            {/* CASES GALLERY GRID */}
                            {loading ? (
                                <div class="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
                                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent mb-3"></div>
                                    <div class="text-slate-600 font-medium text-sm">Loading cases...</div>
                                </div>
                            ) : filteredCases.length === 0 ? (
                                <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                                    <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400 text-2xl mb-3">
                                        <i class="fa-solid fa-car-tunnel"></i>
                                    </div>
                                    <h3 class="text-slate-700 font-semibold mb-1">ไม่พบข้อมูลเคสการล้างคอยล์เย็นที่ตรงกัน</h3>
                                    <p class="text-slate-500 text-sm mb-4">ลองปรับเปลี่ยนตัวกรอง หรือค้นหาด้วยคำอื่น</p>
                                    <button 
                                        onClick={handleResetFilters}
                                        class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-4 py-2 rounded-lg font-medium"
                                    >
                                        ล้างตัวกรองทั้งหมด
                                    </button>
                                </div>
                            ) : (
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredCases.map(item => {
                                        const caseId = getCaseId(item);
                                        const brand = getCaseBrand(item);
                                        const model = getCaseModel(item);
                                        const year = getCaseYear(item);
                                        const images = getCaseImages(item);
                                        const displayImages = images.slice(0, 4);

                                        return (
                                            <div 
                                                key={caseId} 
                                                class="bg-white rounded-2xl shadow-sm hover:shadow-md border border-slate-200 overflow-hidden flex flex-col transition duration-200"
                                            >
                                                {/* Card Header: Car Brand & Model */}
                                                <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                                                    <div>
                                                        <div class="text-xs text-blue-400 font-semibold uppercase tracking-wider">{brand}</div>
                                                        <div class="text-lg font-bold leading-tight">{model} <span class="text-sm font-normal text-slate-400">({year})</span></div>
                                                    </div>
                                                    <div class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md border border-slate-700">
                                                        <i class="fa-solid fa-gauge-high mr-1 text-slate-400"></i>
                                                        {item.mileage ? `${item.mileage} กม.` : 'ไม่ระบุ'}
                                                    </div>
                                                </div>

                                                {/* Images Preview Grid (Up to 4 images) */}
                                                <div class="relative bg-slate-100 h-48 border-b border-slate-200 group cursor-pointer" onClick={() => setShowCaseModal(item)}>
                                                    {displayImages.length === 0 ? (
                                                        <div class="h-full flex flex-col items-center justify-center text-slate-400">
                                                            <i class="fa-regular fa-image text-3xl mb-1"></i>
                                                            <span class="text-xs font-medium">No Image</span>
                                                        </div>
                                                    ) : (
                                                        <div class={`grid h-full w-full ${
                                                            displayImages.length === 1 ? 'grid-cols-1' : 
                                                            displayImages.length === 2 ? 'grid-cols-2' : 
                                                            displayImages.length === 3 ? 'grid-cols-3' : 'grid-cols-2 grid-rows-2'
                                                        }`}>
                                                            {displayImages.map((img, idx) => (

        function AddEditCaseModal({ item, onClose, onSave }) {
            const isEdit = !!item;
            const existingImages = getCaseImages(item);

            const [formData, setFormData] = React.useState({
                id: getCaseId(item) || `case-${Date.now()}`,
                brand: getCaseBrand(item) || 'Toyota',
                model: getCaseModel(item) || '',
                year: getCaseYear(item) || new Date().getFullYear().toString(),
                mileage: item?.mileage || '',
                pressureLow: item?.pressureLow || '',
                pressureHigh: item?.pressureHigh || '',
                date: item?.date || new Date().toISOString().split('T')[0]
            });

            const [imageUrlsText, setImageUrlsText] = React.useState(
                existingImages.map(img => img.url).join('\n')
            );

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!formData.brand || !formData.model) {
                    alert('กรุณากรอกยี่ห้อและรุ่นรถ');
                    return;
                }

                const urls = imageUrlsText.split('\n').map(u => u.trim()).filter(Boolean);
                const updatedImages = urls.map((url, idx) => {
                    const matched = existingImages[idx];
                    return {
                        id: matched?.id || `img-${Date.now()}-${idx}`,
                        name: matched?.name || `IMG${String(idx + 1).padStart(3, '0')}.jpg`,
                        url: url,
                        type: matched?.type || 'unknown'
                    };
                });

                onSave({
                    ...formData,
                    images: updatedImages
                });

                                    type="text" 
                                    value={data.slogan}
                                    onChange={(e) => setData({...data, slogan: e.target.value})}
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">พาดหัวแบนเนอร์หลัก (Hero Title)</label>
                                <input 
                                    type="text" 
                                    value={data.heroTitle}
                                    onChange={(e) => setData({...data, heroTitle: e.target.value})}
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                />
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 mb-1">คำอธิบายใต้พาดหัว</label>
                                <textarea 
                                    rows="2"
                                    value={data.heroSub}
                                    onChange={(e) => setData({...data, heroSub: e.target.value})}
                                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                ></textarea>
                            </div>

                            <div class="pt-3 flex justify-end space-x-3 border-t">
                                <button 
                                    type="button" 
                                    onClick={onClose}
                                    class="px-4 py-2 border text-slate-600 rounded-lg text-xs font-medium hover:bg-slate-50"
                                >
                                    ยกเลิก
                                </button>
                                <button 
                                    type="submit" 
                                    class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-medium shadow"
                                >
                                    บันทึกข้อความ
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function LoginModal({ onClose, onLogin }) {
            return (
                <div class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-100 p-6 text-center">
                        <div class="mb-4">
                            <Air4Logo className="h-12 mx-auto" variant="blue" />
                            <h3 class="text-xl font-bold text-slate-800 mt-2">เข้าสู่ระบบใช้งาน</h3>
                            <p class="text-xs text-slate-500 mt-1">เลือกประเภทการเข้าใช้งานเพื่อทดสอบระบบ</p>
                        </div>

                        <div class="space-y-3 my-6">
                            <button 
                                onClick={() => onLogin({ role: 'admin', name: 'Admin User' })}
                                class="w-full py-3 px-4 bg-slate-900 hover:bg-slate-800 text-white font-semibold rounded-xl text-sm shadow-md transition flex items-center justify-center space-x-2"
                            >
                                <i class="fa-solid fa-user-shield text-amber-400"></i>
                                <span>เข้าสู่ระบบเป็น ผู้ดูแลระบบ (Admin)</span>
                            </button>
                            
                            <button 
                                onClick={() => onLogin({ role: 'customer', name: 'Customer' })}
                                class="w-full py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-800 font-semibold rounded-xl text-sm transition flex items-center justify-center space-x-2 border border-slate-200"
                            >
                                <i class="fa-solid fa-eye text-blue-600"></i>
                                <span>เข้าชมระบบในฐานะ ลูกค้า / ผู้เยี่ยมชม</span>
                            </button>
                        </div>

                        <button 
                            onClick={onClose}
                            class="text-xs text-slate-400 hover:text-slate-600 underline"
                        >
                            ปิดหน้าต่าง
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
